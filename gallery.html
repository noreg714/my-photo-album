<!DOCTYPE html>
<html lang="zh-HK" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Max Ma Collection — Editorial Photography Showcase</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              bg: '#0d0d0d',
              surface: '#141414',
              card: '#111111',
              border: '#222222',
              muted: '#888888',
              gold: '#D4AF37'
            }
          },
          fontFamily: {
            serif: ['Cormorant Garamond', 'Georgia', 'serif'],
            sans: ['Montserrat', 'Helvetica', 'Arial', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Cormorant Garamond & Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Montserrat:ital,wght@0,200;0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- OpenCC-js for Traditional/Simplified Chinese Conversion -->
  <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js"></script>

  <!-- Alpine.js -->
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <style>
    body {
      background-color: #0d0d0d;
      color: #e6e6e6;
      font-family: 'Montserrat', sans-serif;
      overflow-x: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Light Mode Overrides */
    .light body {
      background-color: #f7f7f7;
      color: #1a1a1a;
    }

    .font-serif-title {
      font-family: 'Cormorant Garamond', serif;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0d0d0d;
    }
    .light ::-webkit-scrollbar-track {
      background: #f7f7f7;
    }
    ::-webkit-scrollbar-thumb {
      background: #333333;
      border-radius: 3px;
    }
    .light ::-webkit-scrollbar-thumb {
      background: #cccccc;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #555555;
    }
    .light ::-webkit-scrollbar-thumb:hover {
      background: #999999;
    }

    /* Glassmorphism Header */
    .glass-nav {
      background: rgba(13, 13, 13, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: background 0.3s ease, border-color 0.3s ease;
    }
    .light .glass-nav {
      background: rgba(247, 247, 247, 0.85);
    }

    /* Minimal Hide Scrollbar */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* 真實瀑布流專用樣式 */
    .true-masonry {
      column-gap: 1.5rem;
    }
    .true-masonry.cols-2 { column-count: 2; }
    .true-masonry.cols-3 { column-count: 3; }
    .true-masonry.cols-4 { column-count: 4; }

    @media (max-width: 768px) {
      .true-masonry { column-count: 2 !important; }
    }
    @media (max-width: 480px) {
      .true-masonry { column-count: 1 !important; }
    }

    /* 圖片載入完成的淡入動畫 */
    .fade-in {
      animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }

    /* 載入中骨架屏閃爍特效 */
    @keyframes pulse-slow {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.8; }
    }
    .skeleton-loader {
      animation: pulse-slow 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="selection:bg-white selection:text-black min-h-screen flex flex-col justify-between pb-32"
      x-data="galleryApp()" 
      x-init="initApp()"
      @keydown.escape.window="closeLightbox()"
      @keydown.left.window="if(lightboxOpen) prevPhoto()"
      @keydown.right.window="if(lightboxOpen) nextPhoto()">

  <!-- Fixed Header Navigation (from index.html) -->
  <header class="fixed top-0 left-0 w-full z-50 glass-nav border-b border-neutral-900 [.light_&]:border-neutral-200 flex justify-between items-center px-6 md:px-12 py-6 transition-all duration-300">
    <div class="flex items-center space-x-3 w-1/2 md:w-1/4">
      <span class="text-xs uppercase tracking-[0.3em] font-medium text-white [.light_&]:text-neutral-900" data-i18n="brand-name">MaxMa Collection</span>
      <span class="text-[10px] text-neutral-400 [.light_&]:text-neutral-500 border border-neutral-700 [.light_&]:border-neutral-300 px-2 py-0.5 rounded-full hidden sm:inline-block">EDITION 2026</span>
    </div>

    <!-- Header Navigation Center (Desktop) -->
    <nav class="hidden md:flex justify-center space-x-8 text-xs tracking-[0.2em] uppercase text-neutral-300 [.light_&]:text-neutral-700 w-2/4 text-center">
      <a href="index.html" class="hover:text-white [.light_&]:hover:text-black transition-colors" data-i18n="nav-home">Home</a>
      <a href="gallery.html" class="text-white [.light_&]:text-black font-medium transition-colors" data-i18n="nav-gallery">Gallery</a>
      <a href="index.html#perspectives" class="hover:text-white [.light_&]:hover:text-black transition-colors" data-i18n="nav-perspectives">Perspectives</a>
      <a href="exhibition.html" class="hover:text-white [.light_&]:hover:text-black transition-colors" data-i18n="nav-exhibition">Virtual Space</a>
    </nav>

    <!-- Right Side Controls: Desktop Language & Theme Controls / Mobile Hamburger Button -->
    <div class="flex justify-end items-center space-x-4 w-1/2 md:w-1/4">
      <!-- Desktop EN | 繁 | 簡 Language Switcher -->
      <div class="hidden md:flex items-center space-x-2 text-[10px] uppercase tracking-[0.15em] text-neutral-300 [.light_&]:text-neutral-700">
        <button id="lang-en" onclick="setLanguage('en')" class="hover:text-white [.light_&]:hover:text-black transition-colors">EN</button>
        <span class="text-neutral-600">/</span>
        <button id="lang-tc" onclick="setLanguage('tc')" class="text-white [.light_&]:text-black font-medium transition-colors">繁</button>
        <span class="text-neutral-600">/</span>
        <button id="lang-sc" onclick="setLanguage('sc')" class="hover:text-white [.light_&]:hover:text-black transition-colors">简</button>
      </div>

      <!-- Desktop Black/White Mode Toggle Button -->
      <button id="theme-toggle" onclick="toggleTheme()" class="hidden md:flex items-center justify-center w-8 h-8 rounded-full border border-neutral-700 [.light_&]:border-neutral-300 hover:border-white [.light_&]:hover:border-black text-neutral-300 [.light_&]:text-neutral-700 hover:text-white [.light_&]:hover:text-black transition-all duration-300" aria-label="Toggle Theme">
        <i data-lucide="sun" id="sun-icon" class="w-3.5 h-3.5 hidden"></i>
        <i data-lucide="moon" id="moon-icon" class="w-3.5 h-3.5 block"></i>
      </button>

      <!-- Mobile Hamburger Button (< 768px) -->
      <button id="mobile-menu-btn" onclick="toggleMobileMenu()" class="md:hidden flex items-center justify-center w-8 h-8 text-neutral-300 [.light_&]:text-neutral-700 hover:text-white [.light_&]:hover:text-black transition-colors" aria-label="Open Menu">
        <i data-lucide="menu" id="menu-icon" class="w-5 h-5 block"></i>
        <i data-lucide="x" id="close-icon" class="w-5 h-5 hidden"></i>
      </button>
    </div>
  </header>

  <!-- Mobile Menu Overlay (< 768px) -->
  <div id="mobile-menu" class="fixed inset-0 bg-[#0d0d0d] [.light_&]:bg-[#f7f7f7] z-40 flex flex-col justify-center items-center space-y-8 text-sm uppercase tracking-[0.3em] text-neutral-300 [.light_&]:text-neutral-700 opacity-0 pointer-events-none transition-all duration-300 md:hidden">
    <a href="index.html" onclick="toggleMobileMenu()" class="hover:text-white [.light_&]:hover:text-black transition-colors" data-i18n="nav-home">Home</a>
    <a href="gallery.html" onclick="toggleMobileMenu()" class="text-white [.light_&]:text-black font-medium transition-colors" data-i18n="nav-gallery">Gallery</a>
    <a href="index.html#perspectives" onclick="toggleMobileMenu()" class="hover:text-white [.light_&]:hover:text-black transition-colors" data-i18n="nav-perspectives">Perspectives</a>
    <a href="exhibition.html" onclick="toggleMobileMenu()" class="hover:text-white [.light_&]:hover:text-black transition-colors" data-i18n="nav-exhibition">Virtual Space</a>

    <!-- 分隔線 -->
    <div class="w-12 h-[1px] bg-neutral-800 [.light_&]:bg-neutral-300 my-2"></div>

    <!-- 行動版語系切換 (EN / 繁 / 簡) -->
    <div class="flex items-center space-x-3 text-xs tracking-[0.2em]">
      <button id="mob-lang-en" onclick="setLanguage('en'); toggleMobileMenu();" class="hover:text-white [.light_&]:hover:text-black transition-colors">EN</button>
      <span class="text-neutral-600">/</span>
      <button id="mob-lang-tc" onclick="setLanguage('tc'); toggleMobileMenu();" class="text-white [.light_&]:text-black font-medium transition-colors">繁</button>
      <span class="text-neutral-600">/</span>
      <button id="mob-lang-sc" onclick="setLanguage('sc'); toggleMobileMenu();" class="hover:text-white [.light_&]:hover:text-black transition-colors">简</button>
    </div>

    <!-- 行動版黑白主題切換按鈕 -->
    <button onclick="toggleTheme();" class="flex items-center space-x-2 text-xs tracking-[0.2em] text-neutral-400 hover:text-white [.light_&]:hover:text-black transition-colors pt-2">
      <span id="mob-theme-dark" class="flex items-center space-x-2">
        <i data-lucide="moon" class="w-4 h-4"></i>
        <span class="text-[10px] uppercase">DARK MODE</span>
      </span>
      <span id="mob-theme-light" class="flex items-center space-x-2 hidden">
        <i data-lucide="sun" class="w-4 h-4"></i>
        <span class="text-[10px] uppercase">LIGHT MODE</span>
      </span>
    </button>
  </div>

  <!-- Dynamic Photo Gallery Section -->
  <main id="gallery" class="relative z-30 max-w-[1700px] mx-auto px-6 md:px-12 pt-32 pb-12 w-full flex-grow">
    
    <!-- True Masonry Flow Grid -->
    <div class="true-masonry mb-12"
         :class="{
             'cols-4': gridCols === 4,
             'cols-3': gridCols === 3,
             'cols-2': gridCols === 2
         }">
      
      <template x-for="photo in filteredPhotos" :key="photo.id">
        <div @click="openLightbox(photo)"
             class="card-item group relative cursor-pointer mb-6 break-inside-avoid"
             x-data="{ loaded: false }">
          
          <!-- Image Container with Loading Skeleton Background -->
          <div class="overflow-hidden rounded-lg bg-neutral-900/80 [.light_&]:bg-neutral-200 relative shadow-md min-h-[250px]">
            
            <!-- Loading Skeleton Placeholder -->
            <div x-show="!loaded" class="absolute inset-0 flex flex-col items-center justify-center bg-neutral-900/90 [.light_&]:bg-neutral-200 skeleton-loader z-10">
              <div class="w-6 h-6 border-2 border-neutral-700 border-t-white rounded-full animate-spin mb-2"></div>
              <span class="text-[9px] uppercase tracking-[0.2em] text-neutral-500">LOADING...</span>
            </div>

            <!-- Actual Image with Lazy Loading & Fade-in -->
            <img :src="photo.url" 
                 :alt="photo.title" 
                 loading="lazy"
                 @load="loaded = true"
                 class="w-full h-auto object-cover brightness-90 contrast-115 transition-all duration-700 ease-out group-hover:brightness-105 group-hover:scale-105"
                 :class="loaded ? 'fade-in' : 'opacity-0'">
            
            <!-- Hover Expand Button Badge (Top Right) -->
            <div class="absolute top-4 right-4 opacity-0 group-hover:opacity-100 transition-opacity duration-300 z-20">
              <div class="w-8 h-8 rounded-full bg-black/60 backdrop-blur-md border border-white/25 flex items-center justify-center text-white">
                <i data-lucide="maximize-2" class="w-3.5 h-3.5"></i>
              </div>
            </div>

            <!-- Bottom Left Info Stack (Volume & Location) -->
            <div class="absolute bottom-4 left-4 right-4 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col items-start gap-1.5 z-20">
              <span class="text-[9px] uppercase tracking-[0.25em] bg-black/70 backdrop-blur-md border border-white/10 text-neutral-300 px-3 py-1 rounded-full"
                    x-text="photo.vol"></span>
              <span class="text-[9px] uppercase tracking-[0.2em] bg-black/70 backdrop-blur-md border border-white/10 text-neutral-300 px-3 py-1 rounded-full flex items-center gap-1.5">
                <i data-lucide="map-pin" class="w-3 h-3 text-brand-gold"></i>
                <span x-text="photo.location"></span>
              </span>
            </div>
          </div>

        </div>
      </template>
    </div>

    <!-- Empty State -->
    <div x-show="filteredPhotos.length === 0" class="py-24 text-center text-neutral-500 text-xs uppercase tracking-[0.3em]">
      NO PHOTOGRAPHS FOUND IN THIS CATEGORY.
    </div>

  </main>

  <!-- COMBINED FLOATING CONTROL BAR (Fixed at Bottom Center) -->
  <div class="fixed bottom-6 left-0 w-full z-40 flex justify-center px-4 pointer-events-none">
    <div class="pointer-events-auto inline-flex items-center gap-3 bg-neutral-900/90 [.light_&]:bg-white/90 backdrop-blur-xl border border-neutral-800 [.light_&]:border-neutral-200 p-2 rounded-full shadow-2xl overflow-x-auto max-w-full no-scrollbar">
      
      <!-- Part A: Category Filter Buttons -->
      <div class="flex items-center space-x-1 shrink-0">
        <template x-for="category in categories" :key="category.id">
          <button @click="activeCategory = category.id"
                  :class="activeCategory === category.id 
                    ? 'bg-white [.light_&]:bg-neutral-900 text-black [.light_&]:text-white font-medium shadow-sm' 
                    : 'text-neutral-400 [.light_&]:text-neutral-600 hover:text-white [.light_&]:hover:text-black'"
                  class="px-3 py-1.5 text-[10px] uppercase tracking-[0.15em] rounded-full transition-all duration-300 whitespace-nowrap">
            <span x-text="category.label"></span>
          </button>
        </template>
      </div>

      <!-- Part B: Grid Layout Switcher -->
      <div class="hidden md:flex items-center">
        <div class="w-[1px] h-5 bg-neutral-800 [.light_&]:bg-neutral-250 shrink-0 mx-2"></div>

        <div class="flex items-center space-x-2 shrink-0 px-1">
          <button @click="gridCols = 2" 
                  :class="gridCols === 2 ? 'text-white [.light_&]:text-black' : 'text-neutral-500 hover:text-neutral-300 [.light_&]:hover:text-neutral-700'"
                  title="2 Columns Grid"
                  class="p-1 transition-colors">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
              <rect x="4" y="3" width="7" height="18" rx="1"/>
              <rect x="13" y="3" width="7" height="18" rx="1"/>
            </svg>
          </button>

          <button @click="gridCols = 3" 
                  :class="gridCols === 3 ? 'text-white [.light_&]:text-black' : 'text-neutral-500 hover:text-neutral-300 [.light_&]:hover:text-neutral-700'"
                  title="3 Columns Grid"
                  class="p-1 transition-colors">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
              <rect x="3" y="3" width="8" height="8" rx="1"/>
              <rect x="13" y="3" width="8" height="8" rx="1"/>
              <rect x="3" y="13" width="8" height="8" rx="1"/>
              <rect x="13" y="13" width="8" height="8" rx="1"/>
            </svg>
          </button>

          <button @click="gridCols = 4" 
                  :class="gridCols === 4 ? 'text-white [.light_&]:text-black' : 'text-neutral-500 hover:text-neutral-300 [.light_&]:hover:text-neutral-700'"
                  title="4 Columns Grid"
                  class="p-1 transition-colors">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
              <rect x="3" y="3" width="5" height="5" rx="0.5"/>
              <rect x="9.5" y="3" width="5" height="5" rx="0.5"/>
              <rect x="16" y="3" width="5" height="5" rx="0.5"/>
              <rect x="3" y="9.5" width="5" height="5" rx="0.5"/>
              <rect x="9.5" y="9.5" width="5" height="5" rx="0.5"/>
              <rect x="16" y="9.5" width="5" height="5" rx="0.5"/>
              <rect x="3" y="16" width="5" height="5" rx="0.5"/>
              <rect x="9.5" y="16" width="5" height="5" rx="0.5"/>
              <rect x="16" y="16" width="5" height="5" rx="0.5"/>
            </svg>
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- Luxury Dark Editorial Lightbox Modal -->
  <div x-show="lightboxOpen" 
       x-transition:enter="transition ease-out duration-300"
       x-transition:enter-start="opacity-0"
       x-transition:enter-end="opacity-100"
       x-transition:leave="transition ease-in duration-200"
       x-transition:leave-start="opacity-100"
       x-transition:leave-end="opacity-0"
       class="fixed inset-0 z-50 bg-[#070707]/95 flex flex-col justify-between p-4 sm:p-6 md:p-10 backdrop-blur-2xl overflow-y-auto"
       x-cloak>
    
    <!-- Lightbox Header -->
    <div class="flex items-center justify-between w-full max-w-[1700px] mx-auto z-20 pb-4 border-b border-neutral-900 shrink-0">
      <div class="flex items-center space-x-4 text-xs tracking-[0.25em] text-neutral-500 uppercase">
        <span class="text-white font-medium" x-text="currentPhotoIndex + 1"></span>
        <span>/</span>
        <span x-text="filteredPhotos.length"></span>
        <span class="hidden sm:inline-block border-l border-neutral-800 pl-4 font-serif-title text-base text-white capitalize" x-text="currentPhoto?.title"></span>
      </div>

      <button @click="closeLightbox()" class="p-2.5 rounded-full bg-brand-surface border border-neutral-800 text-neutral-400 hover:text-white hover:border-neutral-600 transition-all">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>

    <!-- Lightbox Body -->
    <div class="flex-grow flex flex-col lg:flex-row items-center justify-center w-full max-w-[1700px] mx-auto my-auto gap-6 relative py-4">
      
      <!-- Prev Navigation Button -->
      <button @click.stop="prevPhoto()" class="absolute left-1 sm:left-4 z-30 p-2.5 sm:p-3 rounded-full bg-black/80 text-neutral-200 hover:text-white hover:bg-black border border-neutral-800 transition-all shadow-lg">
        <i data-lucide="chevron-left" class="w-5 h-5 sm:w-6 sm:h-6"></i>
      </button>

      <!-- Center Image View -->
      <div class="flex-grow max-h-[50vh] lg:max-h-[78vh] w-full flex items-center justify-center px-8 sm:px-12">
        <template x-if="currentPhoto">
          <img :src="currentPhoto.url" 
               :alt="currentPhoto.title"
               class="max-h-[50vh] lg:max-h-[78vh] w-auto max-w-full object-contain rounded-lg shadow-2xl border border-neutral-800/50">
        </template>
      </div>

      <!-- Next Navigation Button -->
      <button @click.stop="nextPhoto()" class="absolute right-1 sm:right-4 z-30 p-2.5 sm:p-3 rounded-full bg-black/80 text-neutral-200 hover:text-white hover:bg-black border border-neutral-800 transition-all shadow-lg">
        <i data-lucide="chevron-right" class="w-5 h-5 sm:w-6 sm:h-6"></i>
      </button>

      <!-- Location & Info Sidebar -->
      <template x-if="currentPhoto">
        <div class="w-full lg:w-80 bg-brand-surface/90 border border-neutral-800 rounded-xl p-5 text-xs space-y-5 shrink-0 backdrop-blur-lg max-h-[40vh] lg:max-h-[78vh] overflow-y-auto">
          <div class="border-b border-neutral-800 pb-4">
            <span class="text-[10px] uppercase tracking-[0.25em] text-neutral-500 block mb-1" x-text="currentPhoto.vol"></span>
            <h2 class="font-serif-title text-2xl text-white font-normal" x-text="currentPhoto.title"></h2>
            <p class="text-neutral-400 text-[11px] mt-2 font-light leading-relaxed" x-text="currentPhoto.description"></p>
          </div>

          <div class="space-y-3 pt-1">
            <div class="text-[10px] uppercase tracking-[0.25em] text-neutral-500 font-medium">LOCATION & COORDINATES</div>
            <div>
              <span class="text-neutral-400 block text-[10px] uppercase tracking-wider mb-1" x-text="currentPhoto.location"></span>
              <a :href="'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(currentPhoto.location + ' ' + currentPhoto.coords)" 
                 target="_blank"
                 class="inline-flex items-center gap-1.5 text-brand-gold hover:underline text-xs font-mono tracking-wider bg-neutral-900/80 border border-neutral-800 px-3 py-2 rounded-lg w-full justify-between transition-colors hover:border-brand-gold/50">
                <span class="flex items-center gap-1.5">
                  <i data-lucide="map-pin" class="w-3.5 h-3.5"></i>
                  <span x-text="currentPhoto.coords"></span>
                </span>
                <i data-lucide="external-link" class="w-3.5 h-3.5 text-neutral-500"></i>
              </a>
            </div>
          </div>
        </div>
      </template>
    </div>

    <!-- Lightbox Footer Instruction -->
    <div class="w-full text-center pt-2 border-t border-neutral-900 text-[10px] uppercase tracking-[0.3em] text-neutral-500 shrink-0">
      USE ARROW KEYS OR BUTTONS TO NAVIGATE • ESC TO CLOSE
    </div>
  </div>

  <!-- Editorial Footer (from index.html) -->
  <footer id="contact" class="relative z-30 bg-black [.light_&]:bg-[#eaeaea] py-12 px-6 md:px-12 border-t border-neutral-900 [.light_&]:border-neutral-300 flex flex-col md:flex-row justify-between items-center text-neutral-500 text-xs transition-colors duration-300">
    <div class="mb-4 md:mb-0 tracking-wider text-center md:text-left" data-i18n="footer-rights">
      © 2026 MAX MA PHOTO COLLECTION. ALL RIGHTS RESERVED.
    </div>
    <div class="flex space-x-6 uppercase tracking-widest text-[10px]">
      <a href="javascript:void(0);" class="hover:text-white [.light_&]:hover:text-black transition-colors">linkedin</a>
    </div>
  </footer>

  <!-- App Data & Logic -->
  <script>
    // Initialize Lucide Icons
    lucide.createIcons();

    function galleryApp() {
      return {
        gridCols: 3,
        activeCategory: 'all',
        lightboxOpen: false,
        currentPhotoIndex: 0,
        currentPhoto: null,

        categories: [
          { id: 'all', label: 'All' },
          { id: 'mountains', label: 'Mountains' },
          { id: 'sunsets', label: 'Sunsets' },
          { id: 'culture', label: 'Culture' },
          { id: 'forests', label: 'Forests' },
          { id: 'cascades', label: 'Cascades' }
        ],

        photos: [

        get filteredPhotos() {
          if (this.activeCategory === 'all') return this.photos;
          return this.photos.filter(p => p.categoryId === this.activeCategory);
        },

        initApp() {
          this.$nextTick(() => lucide.createIcons());
          this.$watch('activeCategory', () => {
            this.$nextTick(() => lucide.createIcons());
          });
          this.$watch('gridCols', () => {
            this.$nextTick(() => lucide.createIcons());
          });
        },

        openLightbox(photo) {
          this.currentPhoto = photo;
          this.currentPhotoIndex = this.filteredPhotos.findIndex(p => p.id === photo.id);
          this.lightboxOpen = true;
          document.body.style.overflow = 'hidden';
          this.$nextTick(() => lucide.createIcons());
        },

        closeLightbox() {
          this.lightboxOpen = false;
          document.body.style.overflow = 'auto';
        },

        nextPhoto() {
          if (this.filteredPhotos.length === 0) return;
          this.currentPhotoIndex = (this.currentPhotoIndex + 1) % this.filteredPhotos.length;
          this.currentPhoto = this.filteredPhotos[this.currentPhotoIndex];
        },

        prevPhoto() {
          if (this.filteredPhotos.length === 0) return;
          this.currentPhotoIndex = (this.currentPhotoIndex - 1 + this.filteredPhotos.length) % this.filteredPhotos.length;
          this.currentPhoto = this.filteredPhotos[this.currentPhotoIndex];
        }
      }
    }

    // Theme Toggle Logic (Black <-> White mode)
    function toggleTheme() {
      const htmlElement = document.documentElement;
      const sunIcon = document.getElementById('sun-icon');
      const moonIcon = document.getElementById('moon-icon');
      const mobThemeDark = document.getElementById('mob-theme-dark');
      const mobThemeLight = document.getElementById('mob-theme-light');

      htmlElement.classList.toggle('light');
      
      const isLight = htmlElement.classList.contains('light');
      
      if (sunIcon && moonIcon) {
        if (isLight) {
          sunIcon.classList.remove('hidden');
          sunIcon.classList.add('block');
          moonIcon.classList.remove('block');
          moonIcon.classList.add('hidden');
        } else {
          sunIcon.classList.remove('block');
          sunIcon.classList.add('hidden');
          moonIcon.classList.remove('hidden');
          moonIcon.classList.add('block');
        }
      }

      if (mobThemeDark && mobThemeLight) {
        if (isLight) {
          mobThemeDark.classList.add('hidden');
          mobThemeLight.classList.remove('hidden');
        } else {
          mobThemeDark.classList.remove('hidden');
          mobThemeLight.classList.add('hidden');
        }
      }
      
      lucide.createIcons();
    }

    // Mobile Menu Toggle Logic
    function toggleMobileMenu() {
      const mobileMenu = document.getElementById('mobile-menu');
      const menuIcon = document.getElementById('menu-icon');
      const closeIcon = document.getElementById('close-icon');

      const isOpen = mobileMenu.classList.contains('opacity-100');

      if (isOpen) {
        mobileMenu.classList.remove('opacity-100', 'pointer-events-auto');
        mobileMenu.classList.add('opacity-0', 'pointer-events-none');
        menuIcon.classList.remove('hidden');
        menuIcon.classList.add('block');
        closeIcon.classList.remove('block');
        closeIcon.classList.add('hidden');
        document.body.style.overflow = '';
      } else {
        mobileMenu.classList.remove('opacity-0', 'pointer-events-none');
        mobileMenu.classList.add('opacity-100', 'pointer-events-auto');
        menuIcon.classList.remove('block');
        menuIcon.classList.add('hidden');
        closeIcon.classList.remove('hidden');
        closeIcon.classList.add('block');
        document.body.style.overflow = 'hidden';
      }
      lucide.createIcons();
    }

    function setLanguage(lang) {
      const btnEn = document.getElementById('lang-en');
      const btnTc = document.getElementById('lang-tc');
      const btnSc = document.getElementById('lang-sc');

      const mobBtnEn = document.getElementById('mob-lang-en');
      const mobBtnTc = document.getElementById('mob-lang-tc');
      const mobBtnSc = document.getElementById('mob-lang-sc');

      [btnEn, btnTc, btnSc, mobBtnEn, mobBtnTc, mobBtnSc].forEach(b => {
        if (b) b.className = "hover:text-white [.light_&]:hover:text-black transition-colors";
      });

      if (lang === 'en') {
        if (btnEn) btnEn.className = "text-white [.light_&]:text-black font-medium transition-colors";
        if (mobBtnEn) mobBtnEn.className = "text-white [.light_&]:text-black font-medium transition-colors";
        applyTranslations(translations.en);
      } else if (lang === 'tc') {
        if (btnTc) btnTc.className = "text-white [.light_&]:text-black font-medium transition-colors";
        if (mobBtnTc) mobBtnTc.className = "text-white [.light_&]:text-black font-medium transition-colors";
        applyTranslations(translations.tc);
      } else if (lang === 'sc') {
        if (btnSc) btnSc.className = "text-white [.light_&]:text-black font-medium transition-colors";
        if (mobBtnSc) mobBtnSc.className = "text-white [.light_&]:text-black font-medium transition-colors";
        
        const converter = OpenCC.Converter({ from: 'hk', to: 'cn' });
        const scDict = {};
        for (let key in translations.tc) {
          scDict[key] = converter(translations.tc[key]);
        }
        applyTranslations(scDict);
      }
    }

    function applyTranslations(dict) {
      const elements = document.querySelectorAll('[data-i18n]');
      elements.forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (dict[key]) {
          el.innerHTML = dict[key];
        }
      });
    }
