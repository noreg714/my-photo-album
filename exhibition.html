         { url: "https://raw.githubusercontent.com/noreg714/test/refs/heads/main/images/Mountains-88.avif" },
          { url: "https://raw.githubusercontent.com/noreg714/test/refs/heads/main/images/Mountains-9.avif" }
        ]
      },
      {
        theme: "Sunsets",
        spotColor: 0xffe2b8,
        artworks: [
         { url: "https://raw.githubusercontent.com/noreg714/test/refs/heads/main/images/Sunsets-10.avif" },
          { url: "https://raw.githubusercontent.com/noreg714/test/refs/heads/main/images/Sunsets-5.avif" }
        ]
      },
      {
        theme: "Culture",
        spotColor: 0xffe2b8,
        artworks: [
          { url: "https://raw.githubusercontent.com/noreg714/test/refs/heads/main/images/Culture-20.avif" },
          { url: "https://raw.githubusercontent.com/noreg714/test/refs/heads/main/images/Culture-4.avif" }
        ]
      },
      {
        theme: "Forests",
        spotColor: 0xffe2b8,
        artworks: [
         { url: "https://raw.githubusercontent.com/noreg714/test/refs/heads/main/images/Forests-27.avif" },
          { url: "https://raw.githubusercontent.com/noreg714/test/refs/heads/main/images/Forests-38.avif" }
        ]
      },
      {
        theme: "Cascades",
        spotColor: 0xffe2b8,
        artworks: [
          { url: "https://raw.githubusercontent.com/noreg714/test/refs/heads/main/images/Cascades-2.avif" },
          { url: "https://raw.githubusercontent.com/noreg714/test/refs/heads/main/images/Cascades-41.avif" }
        ]
      }
    ];

    let titleMeshes = [];
    let plaqueMeshes = [];

    // 滑鼠旋轉與縮放鏡頭變數
    let isDragging = false;
    let previousMousePosition = { x: 0, y: 0 };
    let cameraAngle = 0;
    let cameraHeight = 2.5;     
    let cameraDistance = 8.5;

    const galleryRadius = 14;
    const stationAngles = [0, 1.256, 2.513, 3.769, 5.026];

    // 初始化 Three.js 展館場景
    function initScene() {
      const container = document.getElementById('webgl-canvas');
      const aspect = window.innerWidth / window.innerHeight;
      const isMobile = aspect < 1.0 || window.innerWidth < 768;

      // 1. Scene
      scene = new THREE.Scene();
      const isLight = document.documentElement.classList.contains('light');
      const bgColor = isLight ? 0xf5f0eb : 0x2b231f;
      scene.background = new THREE.Color(bgColor);
      scene.fog = new THREE.FogExp2(bgColor, 0.024);

      // 2. Camera
      const initialFov = isMobile ? 70 : 55;
      camera = new THREE.PerspectiveCamera(initialFov, aspect, 0.1, 100);
      const initDist = isMobile ? galleryRadius - 6.2 : 8.5;
      camera.position.set(0, 2.5, initDist);
      currentLookAt.set(0, 2.65, 14);

      // 3. Renderer
      renderer = new THREE.WebGLRenderer({ canvas: container, antialias: true, powerPreference: "high-performance" });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.12;

      // 4. 建築與鑽石
      buildArchitecture();

      // 5. 5大展區
      buildStations();

      // 6. 互動
      setupInteraction();

      goToStation(0);

      setTimeout(() => {
        const loader = document.getElementById('loading-overlay');
        if (loader) {
          loader.classList.add('opacity-0');
          setTimeout(() => loader.remove(), 700);
        }
      }, 600);

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    function buildArchitecture() {
      const isLight = document.documentElement.classList.contains('light');

      const floorGeo = new THREE.CylinderGeometry(18, 18, 0.2, 64);
      const floorMat = new THREE.MeshStandardMaterial({
        color: isLight ? 0xede6de : 0x221a16,
        roughness: 0.5,
        metalness: 0.1
      });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.position.y = -0.1;
      floor.receiveShadow = true;
      floor.name = "galleryFloor";
      scene.add(floor);

      const ceilingGeo = new THREE.CylinderGeometry(18, 18, 0.2, 64);
      const ceilingMat = new THREE.MeshStandardMaterial({
        color: isLight ? 0xe6dfd5 : 0x1f1713,
        roughness: 0.85
      });
      const ceiling = new THREE.Mesh(ceilingGeo, ceilingMat);
      ceiling.position.y = 5.8;
      ceiling.name = "galleryCeiling";
      scene.add(ceiling);

      const ambientColor = isLight ? 0xfff6ec : 0xffe8d1;
      const ambientLight = new THREE.AmbientLight(ambientColor, isLight ? 0.95 : 0.65);
      ambientLight.name = "ambientLight";
      scene.add(ambientLight);

      const centerLight = new THREE.PointLight(0xffdec2, 2.8, 16);
      centerLight.position.set(0, 4.8, 0);
      centerLight.name = "centerLight";
      scene.add(centerLight);

      const baseGeo = new THREE.CylinderGeometry(1.4, 1.6, 0.8, 32);
      const baseMat = new THREE.MeshStandardMaterial({
        color: isLight ? 0xded4cb : 0x3d302a,
        roughness: 0.35,
        metalness: 0.2
      });
      const base = new THREE.Mesh(baseGeo, baseMat);
      base.position.set(0, 0.4, 0);
      base.castShadow = true;
      base.receiveShadow = true;
      scene.add(base);

      const crystalGeo = new THREE.IcosahedronGeometry(0.85, 0);
      const crystalMat = new THREE.MeshPhysicalMaterial({
        color: 0xffeedd,
        roughness: 0.05,
        metalness: 0.05,
        transmission: 0.92,
        ior: 2.417,
        transparent: true,
        opacity: 0.95,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1
      });
      const crystal = new THREE.Mesh(crystalGeo, crystalMat);
      crystal.position.set(0, 1.6, 0);
      crystal.castShadow = true;
      crystal.name = "centerCrystal";
      scene.add(crystal);
    }

    function buildStations() {
      const textureLoader = new THREE.TextureLoader();
      const isLight = document.documentElement.classList.contains('light');

      galleryData.forEach((data, index) => {
        const angle = stationAngles[index];
        const stationGroup = new THREE.Group();

        const wallWidth = 7.5;
        const wallHeight = 5.2;
        const mainWallGeo = new THREE.BoxGeometry(wallWidth, wallHeight, 0.3);
        const mainWallMat = new THREE.MeshStandardMaterial({
          color: isLight ? 0xf2ece4 : 0x362c27,
          roughness: 0.75
        });
        const mainWall = new THREE.Mesh(mainWallGeo, mainWallMat);
        mainWall.position.set(0, wallHeight / 2, 0);
        mainWall.receiveShadow = true;
        mainWall.castShadow = true;
        mainWall.name = `mainWall_${index}`;
        stationGroup.add(mainWall);

        const sideWallWidth = 2.4;
        const sideWallGeo = new THREE.BoxGeometry(sideWallWidth, wallHeight, 0.25);
        const sideWallMat = new THREE.MeshStandardMaterial({
          color: isLight ? 0xeae2d8 : 0x2b231f,
          roughness: 0.8
        });

        const leftSideWall = new THREE.Mesh(sideWallGeo, sideWallMat);
        leftSideWall.position.set(-wallWidth / 2 - 0.7, wallHeight / 2, 0.7);
        leftSideWall.rotation.y = Math.PI / 6;
        leftSideWall.name = `sideWall_L_${index}`;
        stationGroup.add(leftSideWall);

        const rightSideWall = new THREE.Mesh(sideWallGeo, sideWallMat);
        rightSideWall.position.set(wallWidth / 2 + 0.7, wallHeight / 2, 0.7);
        rightSideWall.rotation.y = -Math.PI / 6;
        rightSideWall.name = `sideWall_R_${index}`;
        stationGroup.add(rightSideWall);

        const spotLight = new THREE.SpotLight(data.spotColor, 2.6);
        spotLight.position.set(0, 6, 2.8);
        spotLight.target = mainWall;
        spotLight.angle = Math.PI / 3.2;
        spotLight.penumbra = 0.5;
        spotLight.castShadow = true;
        stationGroup.add(spotLight);

        const titleGeo = new THREE.PlaneGeometry(2.6, 0.55);
        const titleMat = new THREE.MeshBasicMaterial({ transparent: true });
        const titleMesh = new THREE.Mesh(titleGeo, titleMat);
        titleMesh.position.set(0, 4.3, 0.17);
        stationGroup.add(titleMesh);
        titleMeshes[index] = titleMesh;

        const aspect = window.innerWidth / window.innerHeight;
        const isMobile = aspect < 1.0 || window.innerWidth < 768;
        const frameXPositions = isMobile ? [-1.0, 1.0] : [-1.9, 1.9];

        plaqueMeshes[index] = [];

        data.artworks.forEach((art, artIdx) => {
          const frameWidth = isMobile ? 1.65 : 2.4;
          const frameHeight = isMobile ? 1.25 : 1.7;

          const artworkGroup = new THREE.Group();
          artworkGroup.position.set(frameXPositions[artIdx], 2.4, 0.16);

          const frameBorderGeo = new THREE.BoxGeometry(frameWidth + (isMobile ? 0.1 : 0.16), frameHeight + (isMobile ? 0.1 : 0.16), 0.08);
          const frameBorderMat = new THREE.MeshStandardMaterial({
            color: isLight ? 0x5a4a42 : 0x241d1a,
            roughness: 0.35,
            metalness: 0.15
          });
          const frameBorder = new THREE.Mesh(frameBorderGeo, frameBorderMat);
          artworkGroup.add(frameBorder);

          const matBoardGeo = new THREE.PlaneGeometry(frameWidth + 0.02, frameHeight + 0.02);
          const matBoardMat = new THREE.MeshBasicMaterial({ color: isLight ? 0xffffff : 0x3d302a });
          const matBoard = new THREE.Mesh(matBoardGeo, matBoardMat);
          matBoard.position.z = 0.042;
          matBoard.name = `matBoard_${index}_${artIdx}`;
          artworkGroup.add(matBoard);

          const pictureGeo = new THREE.PlaneGeometry(frameWidth - (isMobile ? 0.12 : 0.2), frameHeight - (isMobile ? 0.12 : 0.2));
          const texture = textureLoader.load(art.url);
          texture.encoding = THREE.sRGBEncoding;

          const pictureMat = new THREE.MeshBasicMaterial({ map: texture });
          const pictureMesh = new THREE.Mesh(pictureGeo, pictureMat);
          pictureMesh.position.z = 0.045;
          artworkGroup.add(pictureMesh);

          pictureMesh.userData = {
            stationId: index,
            artId: artIdx,
            theme: data.theme,
            url: art.url
          };
          interactiveObjects.push(pictureMesh);

          const plaqueGeo = new THREE.PlaneGeometry(isMobile ? 1.0 : 1.4, isMobile ? 0.22 : 0.3);
          const plaqueMat = new THREE.MeshBasicMaterial({ transparent: true, alphaTest: 0.1 });
          const plaqueMesh = new THREE.Mesh(plaqueGeo, plaqueMat);
          plaqueMesh.position.set(0, isMobile ? -0.85 : -1.15, 0.042);
          artworkGroup.add(plaqueMesh);
          plaqueMeshes[index][artIdx] = plaqueMesh;

          stationGroup.add(artworkGroup);
        });

        stationGroup.position.x = Math.sin(angle) * galleryRadius;
        stationGroup.position.z = Math.cos(angle) * galleryRadius;
        stationGroup.rotation.y = angle + Math.PI;

        scene.add(stationGroup);
      });

      updateLanguageUI();
    }

    function updateLanguageUI() {
      applyTranslations(translations[currentLang] || translations.en);

      const isLight = document.documentElement.classList.contains('light');

      galleryData.forEach((data, index) => {
        const themeTitle = getI18nText(`gallery-${index}-title`);

        const titleCanvas = document.createElement('canvas');
        titleCanvas.width = 512;
        titleCanvas.height = 128;
        const ctx = titleCanvas.getContext('2d');
        ctx.fillStyle = isLight ? "#f2ece4" : "#362c27";
        ctx.fillRect(0, 0, 512, 128);
        ctx.fillStyle = isLight ? "#38302a" : "#f4eee9";
        ctx.font = "300 34px 'Cormorant Garamond', 'Noto Sans TC', serif";
        ctx.textAlign = "center";
        ctx.fillText(themeTitle, 256, 75);

        if (titleMeshes[index]) {
          if (titleMeshes[index].material.map) titleMeshes[index].material.map.dispose();
          titleMeshes[index].material.map = new THREE.CanvasTexture(titleCanvas);
          titleMeshes[index].material.needsUpdate = true;
        }

        data.artworks.forEach((art, artIdx) => {
          const artTitle = getI18nText(`gallery-${index}-art${artIdx}-t`);

          const plaqueCanvas = document.createElement('canvas');
          plaqueCanvas.width = 400;
          plaqueCanvas.height = 80;
          const pCtx = plaqueCanvas.getContext('2d');
          
          pCtx.clearRect(0, 0, 400, 80);
          pCtx.fillStyle = isLight ? "#38302a" : "#f4eee9";
          pCtx.font = "300 22px 'Montserrat', 'Noto Sans TC', sans-serif";
          pCtx.textAlign = "center";
          pCtx.textBaseline = "middle";
          pCtx.fillText(artTitle, 200, 40);

          const pm = plaqueMeshes[index][artIdx];
          if (pm) {
            if (pm.material.map) pm.material.map.dispose();
            pm.material.map = new THREE.CanvasTexture(plaqueCanvas);
            pm.material.needsUpdate = true;
          }
        });
      });
    }

    function getI18nText(key) {
      const dict = translations[currentLang] || translations.en;
      return dict[key] || "";
    }

    function goToStation(index) {
      currentStationIndex = index;

      document.querySelectorAll('.station-btn').forEach((btn, i) => {
        if (i === index) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      const aspect = window.innerWidth / window.innerHeight;
      const isMobile = aspect < 1.0 || window.innerWidth < 768;
      const angle = stationAngles[index];
      cameraAngle = angle;

      cameraDistance = isMobile ? galleryRadius - 6.2 : galleryRadius - 5.5;
      cameraHeight = isMobile ? 2.5 : 2.2;

      updateCameraTarget();
    }

    function updateCameraTarget() {
      const aspect = window.innerWidth / window.innerHeight;
      const isMobile = aspect < 1.0 || window.innerWidth < 768;

      targetCameraPos.x = Math.sin(cameraAngle) * cameraDistance;
      targetCameraPos.z = Math.cos(cameraAngle) * cameraDistance;
      targetCameraPos.y = cameraHeight;

      targetLookAt.x = Math.sin(cameraAngle) * galleryRadius;
      targetLookAt.z = Math.cos(cameraAngle) * galleryRadius;
      targetLookAt.y = isMobile ? 2.65 : 2.6;
    }

    function setupInteraction() {
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();

      document.querySelectorAll('.station-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = parseInt(btn.getAttribute('data-station'));
          goToStation(idx);
        });
      });

      document.getElementById('reset-cam-btn').addEventListener('click', () => {
        goToStation(currentStationIndex);
      });

      let isMoodMode = true;
      document.getElementById('toggle-light-btn').addEventListener('click', () => {
        isMoodMode = !isMoodMode;
        const amb = scene.getObjectByName("ambientLight");
        const centerL = scene.getObjectByName("centerLight");
        const btnText = document.getElementById('light-btn-text');

        if (isMoodMode) {
          amb.intensity = 0.65;
          centerL.intensity = 2.8;
          renderer.toneMappingExposure = 1.12;
          btnText.innerText = getI18nText('lightMood');
        } else {
          amb.intensity = 1.15;
          centerL.intensity = 4.5;
          renderer.toneMappingExposure = 1.32;
          btnText.innerText = getI18nText('lightHighlight');
        }
      });

      const bgAudio = new Audio('https://noreg714.github.io/test/audio/amb-river-and-birds.mp3');
      bgAudio.loop = true;
      let isAudioPlaying = false;

      document.getElementById('toggle-audio-btn').addEventListener('click', () => {
        const icon = document.getElementById('audio-icon');
        const text = document.getElementById('audio-text');

        if (!isAudioPlaying) {
          bgAudio.play().then(() => {
            isAudioPlaying = true;
            icon.setAttribute('data-lucide', 'volume-2');
            icon.className = "w-3.5 h-3.5 text-[#f4eee9] animate-pulse";
            text.innerText = getI18nText('audioOn');
            lucide.createIcons();
          }).catch(e => {
            console.log("Audio play error:", e);
          });
        } else {
          bgAudio.pause();
          isAudioPlaying = false;
          icon.setAttribute('data-lucide', 'volume-x');
          icon.className = "w-3.5 h-3.5 text-[#b5a193]";
          text.innerText = getI18nText('audioOff');
          lucide.createIcons();
        }
      });

      const canvas = document.getElementById('webgl-canvas');
      let touchStartDist = 0;

      canvas.addEventListener('mousedown', (e) => {
        isDragging = true;
        previousMousePosition = { x: e.clientX, y: e.clientY };
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const deltaX = e.clientX - previousMousePosition.x;
        const deltaY = e.clientY - previousMousePosition.y;

        cameraAngle -= deltaX * 0.004;
        cameraHeight = Math.max(0.5, Math.min(4.5, cameraHeight + deltaY * 0.004));

        updateCameraTarget();
        previousMousePosition = { x: e.clientX, y: e.clientY };
      });

      window.addEventListener('mouseup', () => {
        isDragging = false;
      });

      canvas.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          isDragging = true;
          previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        } else if (e.touches.length === 2) {
          isDragging = false;
          touchStartDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
        }
      }, { passive: false });

      canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();

        if (e.touches.length === 1 && isDragging) {
          const deltaX = e.touches[0].clientX - previousMousePosition.x;
          const deltaY = e.touches[0].clientY - previousMousePosition.y;

          cameraAngle -= deltaX * 0.005;
          cameraHeight = Math.max(0.5, Math.min(4.5, cameraHeight + deltaY * 0.005));

          updateCameraTarget();
          previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        } else if (e.touches.length === 2) {
          const currentDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          const deltaDist = currentDist - touchStartDist;

          cameraDistance = Math.max(3.0, Math.min(16.0, cameraDistance - deltaDist * 0.02));
          updateCameraTarget();

          touchStartDist = currentDist;
        }
      }, { passive: false });

      canvas.addEventListener('touchend', () => {
        isDragging = false;
      });

      window.addEventListener('wheel', (e) => {
        cameraDistance = Math.max(3.0, Math.min(16.0, cameraDistance + e.deltaY * 0.005));
        updateCameraTarget();
      }, { passive: true });

      window.addEventListener('click', (e) => {
        if (e.target.closest('button') || e.target.closest('a') || e.target.closest('#artwork-modal')) return;

        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(interactiveObjects);

        if (intersects.length > 0) {
          const artData = intersects[0].object.userData;
          openModal(artData);
        }
      });

      document.getElementById('close-modal-btn').addEventListener('click', closeModal);
      document.getElementById('artwork-modal').addEventListener('click', (e) => {
        if (e.target.id === 'artwork-modal') closeModal();
      });
    }

    function openModal(data) {
      const modal = document.getElementById('artwork-modal');
      const modalCard = document.getElementById('modal-card');
      
      const title = getI18nText(`gallery-${data.stationId}-art${data.artId}-t`);
      const desc = getI18nText(`gallery-${data.stationId}-art${data.artId}-d`);

      document.getElementById('modal-img').src = data.url;
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-desc').innerText = desc;

      modal.classList.remove('pointer-events-none');
      modal.classList.remove('opacity-0');
      modalCard.classList.remove('scale-95');
      modalCard.classList.add('scale-100');
    }

    function closeModal() {
      const modal = document.getElementById('artwork-modal');
      const modalCard = document.getElementById('modal-card');

      modal.classList.add('opacity-0');
      modalCard.classList.remove('scale-100');
      modalCard.classList.add('scale-95');

      setTimeout(() => {
        modal.classList.add('pointer-events-none');
      }, 300);
    }

    function toggleTheme() {
      const htmlElement = document.documentElement;
      const sunIcon = document.getElementById('sun-icon');
      const moonIcon = document.getElementById('moon-icon');

      htmlElement.classList.toggle('light');
      const isLight = htmlElement.classList.contains('light');

      if (sunIcon && moonIcon) {
        if (isLight) {
          sunIcon.classList.remove('hidden');
          sunIcon.classList.add('block');
          moonIcon.classList.remove('block');
          moonIcon.classList.add('hidden');
        } else {
          sunIcon.classList.remove('block');
          sunIcon.classList.add('hidden');
          moonIcon.classList.remove('hidden');
          moonIcon.classList.add('block');
        }
      }

      if (scene) {
        const bgColor = isLight ? 0xf5f0eb : 0x2b231f;
        scene.background.setHex(bgColor);
        scene.fog.color.setHex(bgColor);

        const floor = scene.getObjectByName("galleryFloor");
        if (floor) floor.material.color.setHex(isLight ? 0xede6de : 0x221a16);

        const ceiling = scene.getObjectByName("galleryCeiling");
        if (ceiling) ceiling.material.color.setHex(isLight ? 0xe6dfd5 : 0x1f1713);

        const amb = scene.getObjectByName("ambientLight");
        if (amb) {
          amb.color.setHex(isLight ? 0xfff6ec : 0xffe8d1);
          amb.intensity = isLight ? 0.95 : 0.65;
        }

        galleryData.forEach((_, idx) => {
          const mainWall = scene.getObjectByName(`mainWall_${idx}`);
          if (mainWall) mainWall.material.color.setHex(isLight ? 0xf2ece4 : 0x362c27);

          const sideL = scene.getObjectByName(`sideWall_L_${idx}`);
          if (sideL) sideL.material.color.setHex(isLight ? 0xeae2d8 : 0x2b231f);

          const sideR = scene.getObjectByName(`sideWall_R_${idx}`);
          if (sideR) sideR.material.color.setHex(isLight ? 0xeae2d8 : 0x2b231f);

          [0, 1].forEach(artIdx => {
            const matBoard = scene.getObjectByName(`matBoard_${idx}_${artIdx}`);
            if (matBoard) matBoard.material.color.setHex(isLight ? 0xffffff : 0x3d302a);
          });
        });

        updateLanguageUI();
      }

      lucide.createIcons();
    }

    function setLanguage(lang) {
      currentLang = lang;
      const btnEn = document.getElementById('lang-en');
      const btnTc = document.getElementById('lang-tc');
      const btnSc = document.getElementById('lang-sc');

      [btnEn, btnTc, btnSc].forEach(b => {
        if (b) b.className = "hover:text-[#f4eee9] [.light_&]:hover:text-[#38302a] transition-colors";
      });

      if (lang === 'en') {
        if (btnEn) btnEn.className = "text-[#f4eee9] [.light_&]:text-[#38302a] font-medium transition-colors";
        updateLanguageUI();
      } else if (lang === 'tc') {
        if (btnTc) btnTc.className = "text-[#f4eee9] [.light_&]:text-[#38302a] font-medium transition-colors";
        updateLanguageUI();
      } else if (lang === 'sc') {
        if (btnSc) btnSc.className = "text-[#f4eee9] [.light_&]:text-[#38302a] font-medium transition-colors";
        
        const converter = OpenCC.Converter({ from: 'hk', to: 'cn' });
        const scDict = {};
        for (let key in translations.tc) {
          scDict[key] = converter(translations.tc[key]);
        }
        translations.sc = scDict;
        updateLanguageUI();
      }
    }

    function applyTranslations(dict) {
      const elements = document.querySelectorAll('[data-i18n]');
      elements.forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (dict[key]) {
          el.innerText = dict[key];
        }
      });
    }

    function onWindowResize() {
      const aspect = window.innerWidth / window.innerHeight;
      const isMobile = aspect < 1.0 || window.innerWidth < 768;
      
      camera.aspect = aspect;
      camera.fov = isMobile ? 70 : 55;
      camera.updateProjectionMatrix();
      
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);

      camera.position.lerp(targetCameraPos, 0.06);
      currentLookAt.lerp(targetLookAt, 0.06);
      camera.lookAt(currentLookAt);

      const centerCrystal = scene.getObjectByName("centerCrystal");
      if (centerCrystal) {
        centerCrystal.rotation.y += 0.008;
        centerCrystal.rotation.x += 0.003;
        centerCrystal.position.y = 1.6 + Math.sin(Date.now() * 0.0015) * 0.12;
      }

      renderer.render(scene, camera);
    }

    window.onload = function () {
      lucide.createIcons();
      initScene();
    };
  </script>
</body>
</html>
